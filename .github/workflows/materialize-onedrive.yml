name: Materialize OneDrive sources

on:
  push:
    branches:
      - hrop/onedrive-sharepoint-backup-595d
    paths:
      - payload/READY

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove the temporary source payload
        run: |
          git config user.name "hroperators"
          git config user.email "109808831+hroperators@users.noreply.github.com"
          git rm -r payload .github/workflows/materialize-onedrive.yml .github/materialize_onedrive.py
          git commit -m "chore: remove OneDrive source payload"
          git push
